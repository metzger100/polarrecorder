[project]
name = "polarrecorder"
dynamic = ["version"]
requires-python = ">=3.9"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Put the repo root on sys.path so `import polarrecorder` / `import plugin` resolve from
# tests regardless of invocation. `python -m pytest` already does this via the -m flag, but
# this makes bare `pytest` work too (the layout has conftest.py under tests/, not at root).
pythonpath = [".", "server"]

[tool.ruff]
target-version = "py39"
line-length = 100
# "*.md" is excluded because Ruff's default file_resolver.include now contains "*.md" and
# formats embedded Python fenced code blocks in Markdown; Markdown is Prettier's format
# domain, not Ruff's, and this default once caused `ruff format --check .` to want to
# reformat historical exec-plans/completed/PLAN1.md.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
  "E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH", "RUF",
  "C90", "D", "PT", "ARG", "ERA", "S", "PIE", "RSE", "RET", "FBT", "PL",
  "T20", "TID", "FA", "C4", "BLE", "TRY", "EM", "G", "PERF", "PTH", "YTT",
  "DTZ", "FURB",
]
# E=pycodestyle, F=pyflakes, W=warnings, I=isort, N=naming,
# UP=pyupgrade, B=bugbear, A=builtins, SIM=simplify, TCH=type-checking, RUF=ruff-specific,
# C90=mccabe complexity, D=pydocstyle docstrings, PT=pytest-style, ARG=unused-arguments,
# ERA=commented-out code, S=bandit security, PIE=unnecessary-pass/reimplemented-builtins,
# RSE=raise-without-message, RET=return-consistency, FBT=boolean-trap, PL=pylint-subset,
# T20=flake8-print (no print() calls), TID=flake8-tidy-imports (banned imports),
# FA=flake8-future-annotations (enforces `from __future__ import annotations` in every file),
# C4=comprehensions, BLE=blind-except, TRY=exception style, EM=exception messages,
# G=logging format, PERF=performance, PTH=pathlib, YTT=sys.version checks,
# DTZ=datetime timezone checks, FURB=refurb
ignore = [
  "D100",   # missing module docstring (covered by file headers)
  "D104",   # missing __init__.py docstring
  "D203",   # conflicts with D211 (no-blank-line-before-class vs one-blank-line-before-class)
  "D213",   # conflicts with D212 (multi-line-summary-second-line vs first-line)
  "S101",   # assert in non-test code (used for internal invariants)
  "FBT001", # boolean positional arg in function def (too strict for dataclass fields)
  "FBT002", # boolean default value in function def (same reason)
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 10
max-returns = 4
max-statements = 40

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
# Ban AvNav imports in server/polarrecorder/ — AvNav API is injected via reader.py's StoreAPI protocol
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"avnav_api".msg = "AvNav imports are not allowed in server/polarrecorder/. Use dependency injection via StoreAPI."
"pluginhandler".msg = "AvNav imports are not allowed in server/polarrecorder/. Use dependency injection via StoreAPI."
"avnav_store".msg = "AvNav imports are not allowed in server/polarrecorder/. Use dependency injection via StoreAPI."
"avnav_nmea".msg = "AvNav imports are not allowed in server/polarrecorder/. Use dependency injection via StoreAPI."

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "D",       # docstrings not required on test functions
  "S101",    # assert is the whole point of tests
  "PLR2004", # magic values in test assertions are fine
  "ARG001",  # unused function arguments (pytest fixtures appear unused)
  "ARG002",  # unused method arguments (same reason)
  "N802",    # FakeAvNavAPI mirrors AvNav method names (getSingleValue, setStatus, ...)
  "N803",    # FakeAvNavAPI mirrors AvNav arg names (includeInfo, iconFile, ...)
]
"server/polarrecorder/__init__.py" = ["D104"]  # __init__.py needs no docstring
"plugin.py" = ["D100", "TID251", "E402", "N802", "BLE001"]  # module docstring covered by file header; AvNav imports are legitimate here; E402 for the mandatory sys.path import guard (imports follow the path-insertion); N802 for the AvNav-mandated classmethod name pluginInfo; BLE001 catches are AvNav boundary crash safety
# Tool-appropriate rules (not the product-module ruleset): maintained CLI/checker scripts
# under tools/ are not product-module Documentation/Depends-headered files, so D (docstrings)
# is ceremony rather than a real contract; T20 legitimately prints CLI output/reports; TRY003/
# EM101/EM102's exception-message style exists to keep shipped product exceptions clean for
# logs/users, and does not carry the same weight for a one-off local dev-tool error string;
# PLR2004's magic-value rule targets hardcoded model/validation thresholds in product code
# (documentation/conventions/coding-standards.md), not fixture literals or CLI/report
# thresholds in dev tooling. Correctness, security, complexity, and style rules outside this
# list still apply to tools/ in full.
"tools/**/*.py" = ["D", "T20", "TRY003", "EM101", "EM102", "PLR2004"]

[tool.mypy]
# Current mypy releases only support analyzing Python 3.10+. Runtime Python 3.9
# compatibility is enforced separately by tools/check-python-compat.py.
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict_equality_for_none = true

# `avnav_api` lives in the AvNav server source tree, not on the dev/CI sys.path. plugin.py
# imports `AVNApi` only under `if TYPE_CHECKING:` (never at runtime — see Layer 1 / Python
# Rules), so this override lets `mypy --strict` resolve that type-checking-only import without
# AvNav installed. `AVNApi` is then treated as `Any` at the boundary, which is acceptable.
[[tool.mypy.overrides]]
module = ["avnav_api"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["polarrecorder"]
# `[tool.coverage.run] source` only affects a bare `coverage run` invocation; the actual
# gate (`npm run test:coverage:python`) passes explicit `--cov=polarrecorder --cov=plugin`
# on the pytest-cov command line, so plugin.py is measured too. Its own combined
# line+branch floor is enforced by tools/quality-policy/check-coverage-inventory.mjs,
# not by this section.

[tool.coverage.report]
fail_under = 90
show_missing = true
# Lines that never execute at runtime by design — excluded so they don't count as "missing".
# Covers the TYPE_CHECKING import blocks (export.py) and the Protocol method stub bodies
# (reader.py StoreAPI, logger.py Logger). NOTE: rules_enhanced.py is NOT covered by these
# excludes — it ships real optional-signal rules exercised by
# tests/test_validation_enhanced.py and held to the validation-package 95%/95% floor
# (tools/quality-policy/check-coverage-inventory.mjs), not a smoke import.
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "@(typing\\.)?overload",
    "^\\s*\\.\\.\\.\\s*$",
    "if __name__ == .__main__.:",
]
