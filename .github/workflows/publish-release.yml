name: Publish Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository at tag ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref }}

      - name: Validate release tag
        id: release_version
        shell: bash
        run: node tools/release-version.mjs --github-output "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Verify committed release artifacts
        id: release_assets
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.release_version.outputs.version }}"
          zip_path="releases/polarrecorder-${version}.zip"
          notes_path="releases/polarrecorder-${version}.md"

          if [[ ! -f "$zip_path" || ! -f "$notes_path" ]]; then
            echo "Release artifacts not found. Run the local release workflow first."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "zip_path=$zip_path" >> "$GITHUB_OUTPUT"
          echo "notes_path=$notes_path" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: Polar Recorder v${{ steps.release_assets.outputs.version }}
          body_path: ${{ steps.release_assets.outputs.notes_path }}
          files: ${{ steps.release_assets.outputs.zip_path }}
          prerelease: ${{ steps.release_version.outputs.prerelease }}
